<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>aw-watcher-media-player</title>

        <style>
            :root {
                --bar-text: #333;
                --bar-background: rgb(204, 204, 204);
                --bar-background-hover: rgb(184, 184, 184);

                color: #333;
                font-family: sans-serif;
                font-size: 14px;
            }

            body {
                margin: 0;
            }

            :root.theme-dark {
                --bar-text: #fff;
                --bar-background: #666666;
                --bar-background-hover: #555555;

                background-color: #1a1d24;
                color: #e9ebf0;
            }

            .theme-dark svg text {
                text-shadow: #000 0.5px 0.5px 0.5px;
            }

            svg text {
                fill: var(--bar-text);
            }

            svg g:hover rect {
                fill: var(--bar-background-hover);
            }

            svg rect {
                fill: var(--bar-background);
            }

            .text-small {
                font-size: 11px;
            }
        </style>
    </head>

    <body>
        <div id="summary">Loading...</div>
    </body>

    <script>
        // A small hack to make the aw-client work in the browser without webpack
        const exports = {};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/aw-client@0.4.1/out/aw-client.min.js"></script>
    <script type="module" defer>
        const urlParams = new URLSearchParams(window.location.search);
        const start = urlParams.get("start");
        const end = urlParams.get("end");
        const hostname = urlParams.get("hostname");

        const client = new AWClient("aw-watcher-media-player", {
            baseURL: window.location.origin,
        });

        const server_settings = await client.get_settings();
        const theme = server_settings.theme;
        if (theme === "dark") {
            document.documentElement.classList.add("theme-dark");
        }

        function getNameFromEventData(data) {
            const artist = data.artist;

            if (!artist) {
                return "Unknown";
            }

            return artist;
        }

        const MAX_AGGREGATIONS = 50;
        const SVG_XMINS = "http://www.w3.org/2000/svg";

        function formatDuration(seconds) {
            // Returns a human-readable duration string
            const hrs = Math.floor(seconds / 60 / 60);
            const min = Math.floor((seconds / 60) % 60);
            const sec = Math.floor(seconds % 60);
            const l = [];

            if (hrs > 0) {
                l.push(hrs + "h");
                l.push(min + "m");
            } else if (min > 0) {
                l.push(min + "m");
            }
            l.push(sec + "s");

            return l.join(" ");
        }

        function displayAggregatedDurationChart(aggregatedDurations) {
            const svg = document.createElementNS(SVG_XMINS, "svg");

            svg.setAttribute("xmins", SVG_XMINS);
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", aggregatedDurations.length * 51);

            let y = 0;

            const maxDuration = Math.max(
                ...aggregatedDurations.map(({ duration }) => duration),
            );

            aggregatedDurations.forEach(({ data, duration }, index) => {
                const nameString = getNameFromEventData(data);
                const durationString = formatDuration(duration);

                const group = document.createElementNS(SVG_XMINS, "g");
                svg.appendChild(group);

                const title = document.createElementNS(SVG_XMINS, "title");
                title.textContent = `${nameString}\n${durationString}`;
                group.appendChild(title);

                const rect = document.createElementNS(SVG_XMINS, "rect");
                rect.setAttribute("x", "0");
                rect.setAttribute("y", y);
                rect.setAttribute("rx", "5");
                rect.setAttribute("ry", "5");

                // Set the width of the duration rectangle based on the maximum duration
                rect.setAttribute(
                    "width",
                    `${(duration / maxDuration) * 100}%`,
                );

                rect.setAttribute("height", "46");
                group.appendChild(rect);

                const textName = document.createElementNS(SVG_XMINS, "text");
                textName.setAttribute("x", "5");
                textName.setAttribute("y", y + 19.6);
                textName.textContent = nameString;
                group.appendChild(textName);

                const textDuration = document.createElementNS(
                    SVG_XMINS,
                    "text",
                );
                textDuration.setAttribute("x", "5");
                textDuration.setAttribute("y", y + 36.4);
                textDuration.classList.add("text-small");
                textDuration.textContent = durationString;
                group.appendChild(textDuration);

                y += 51;
            });

            document.getElementById("summary").innerHTML = "";
            document.getElementById("summary").appendChild(svg);
        }

        const query = `
        events = query_bucket("aw-watcher-media-player_${hostname}");

        artists = merge_events_by_keys(events, ["artist"]);
        artists = sort_by_duration(artists);
        artists = limit_events(artists, ${MAX_AGGREGATIONS});

        RETURN = artists;
    `;

        client
            .query([`${start}/${end}`], [query])
            .then((awData) => {
                const events = awData[0];

                displayAggregatedDurationChart(events);
            })
            .catch((error) => {
                console.error("Error fetching data:", error);
            });
    </script>
</html>
